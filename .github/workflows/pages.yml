name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 的官方要求:读代码 + 写 Pages + 用 OIDC 令牌发布。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个发布;新的推送取消排队中的旧发布。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 站点根就是 web/ —— 页面里的引用全是相对路径(style.css / app.js /
      # stability-core.js),所以放在 https://<user>.github.io/<repo>/ 下能直接跑,
      # 不需要任何构建或改写。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
